[project]
name = "sitre-rpc"
version = "0.1.0"
description = "Sistema Distribuido de Transcripción y Resumen Ejecutivo en Español"
requires-python = ">=3.10"
dependencies = [
    # Compartido server + client
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[dependency-groups]
server = [
    # Modelos ML
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "openai-whisper>=20231117",
    "numba>=0.59.0,<0.62.0",
    "sentencepiece>=0.2.0",
    "accelerate>=0.27.0",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.0",
    # Tracking
    "mlflow>=2.11.0",
]
client = [
    "streamlit>=1.32.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools]
packages = ["server", "client"]

# Instala PyTorch solo para CPU (sin CUDA) → ~250MB en vez de ~2GB
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["E402"]
"client/app.py" = ["E402"]
