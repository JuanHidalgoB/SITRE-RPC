# SITRE-RPC — GitLab CI/CD Pipeline
# Variables requeridas en GitLab > Settings > CI/CD > Variables:
#   DOCKERHUB_USERNAME   — Usuario de DockerHub
#   DOCKERHUB_PASSWORD   — Contraseña/token de DockerHub
#   DO_SSH_PRIVATE_KEY   — Clave SSH privada para el Droplet (base64)
#   DO_DROPLET_IP        — IP pública del Droplet
#   DO_DEPLOY_USER       — Usuario SSH del Droplet (ej. root)

variables:
  SERVER_IMAGE: "$DOCKERHUB_USERNAME/sitre-rpc-server"
  CLIENT_IMAGE: "$DOCKERHUB_USERNAME/sitre-rpc-client"
  DOCKER_BUILDKIT: 1

stages:
  - setup
  - lint & test
  - build
  - deploy

setup:
  stage: setup
  image: simon2123/sitre-rpc-ci:latest
  script:
    # Genera los stubs proto usando el venv pre-instalado en la imagen — sin tocar uv sync
    - mkdir -p generated
    - /ci/.venv/bin/python -m grpc_tools.protoc -I proto --python_out=generated --grpc_python_out=generated proto/sitre.proto
    - touch generated/__init__.py
  artifacts:
    paths:
      - generated/
    expire_in: 1 hour

lint:
  stage: lint & test
  image: simon2123/sitre-rpc-ci:latest
  needs:
    - job: setup
      artifacts: true
  script:
    - export PATH="/ci/.venv/bin:$PATH"
    - ruff check . --fix --exclude generated/
    - ruff format . --exclude generated/

test:
  stage: lint & test
  image: simon2123/sitre-rpc-ci:latest
  needs:
    - job: setup
      artifacts: true
  script:
    - export PATH="/ci/.venv/bin:$PATH"
    - pytest tests/ -v

build_image:
  stage: build
  needs:
    - job: lint
    - job: test
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  image: docker:29.0-cli
  services:
    - docker:29.0-dind
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    # Servidor (imagen pesada — solo cambia si tocan ML o server/)
    - docker pull $SERVER_IMAGE:latest || true
    - >
      docker build
      --cache-from $SERVER_IMAGE:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -f Dockerfile.server
      -t $SERVER_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $SERVER_IMAGE:latest
      .
    - docker push $SERVER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $SERVER_IMAGE:latest
    # Cliente (imagen liviana — streamlit + grpcio)
    - docker pull $CLIENT_IMAGE:latest || true
    - >
      docker build
      --cache-from $CLIENT_IMAGE:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -f Dockerfile.client
      -t $CLIENT_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $CLIENT_IMAGE:latest
      .
    - docker push $CLIENT_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CLIENT_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  needs:
    - job: build_image
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - echo "$DO_SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DO_DROPLET_IP" >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml "$DO_DEPLOY_USER@$DO_DROPLET_IP:/opt/sitre-rpc/docker-compose.yml"
    - |
      ssh "$DO_DEPLOY_USER@$DO_DROPLET_IP" "
        docker pull $SERVER_IMAGE:latest &&
        docker pull $CLIENT_IMAGE:latest &&
        cd /opt/sitre-rpc &&
        docker compose up -d --remove-orphans
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: http://$DO_DROPLET_IP:8501
